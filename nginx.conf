server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Las fotos se guardan 30 días en el navegador; index.html les pone ?v=N,
    # así que al cambiar N se descargan de nuevo.
    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    # La página siempre se revisa con el servidor para que los cambios se vean al recargar.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
