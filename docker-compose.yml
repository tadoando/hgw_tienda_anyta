name: hgw_tienda_anyta

services:
  web:
    build: .
    image: hgw_tienda_anyta:latest
    container_name: hgw_tienda_anyta
    restart: unless-stopped
    ports:
      # Atado a la IP del ProBook (Docker se salta el firewall).
      # Puerto configurable en .env; cada web necesita uno distinto.
      - "${WEB_IP:-192.168.80.27}:${WEB_PORT:-8082}:80"
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Publica la tienda en internet por Cloudflare Tunnel (ver README).
  # Solo arranca si .env tiene COMPOSE_PROFILES=tunel.
  # No abre puertos: sale hacia Cloudflare y entra a "web" por la red interna.
  tunel:
    image: cloudflare/cloudflared:2026.10.3
    container_name: hgw_tienda_anyta_tunel
    profiles: ["tunel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run
    env_file:
      # TUNNEL_TOKEN=... (root:tado 640, nunca en el repo)
      - path: /etc/hgw_tienda_anyta/hgw_tienda_anyta.env
        required: false
    depends_on:
      web:
        condition: service_healthy
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
